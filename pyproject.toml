[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stretchwbc"
version = "0.1.0"
description = "Whole-body control and a QP safety filter for a Hello Robot Stretch 3"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Parth Deshmukh" }]
keywords = ["robotics", "mobile-manipulation", "inverse-kinematics", "control-barrier-functions", "ros2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# The kinematics, solvers and safety filter need numpy alone. PyTorch is an
# extra because behaviour cloning is one module out of five, and nobody should
# install a deep-learning framework to run an IK solver.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
learning = ["torch>=2.0"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "scipy>=1.10"]
all = ["torch>=2.0", "matplotlib>=3.7", "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "tests", "examples", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
