name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,learning,plots]" mujoco

      # The exact-geometry tests compare against MuJoCo Menagerie's Stretch 3 model.
      - name: Fetch the Menagerie Stretch 3 model
        run: python tools/fetch_menagerie.py

      - name: Lint
        run: ruff check src tests examples tools

      - name: Format check
        run: ruff format --check src tests examples tools

      - name: Test
        run: pytest --cov=stretchwbc --cov-report=term-missing

      # Shortened runs: the examples produce the README's numbers at their full
      # size, which takes minutes. CI checks they still run and still agree with
      # the committed golden values, not that they reproduce every digit.
      - name: Run examples
        env:
          WBC_N_TARGETS: "60"
          WBC_N_EPISODES: "25"
          WBC_BC_EPISODES: "30"
          WBC_BC_EVAL: "15"
          WBC_BC_EPOCHS: "15"
        run: |
          python examples/01_solver_benchmark.py
          python examples/02_safety_benchmark.py
          python examples/03_behaviour_cloning.py
          python examples/05_exact_geometry.py

      # The C++ port is checked against the Python reference through a
      # generated header. If regenerating it here changes anything, the two
      # implementations have drifted and the build should stop.
      - name: Golden header is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python tools/generate_golden.py
          python tools/generate_ros_golden.py
          git diff --exit-code cpp/test/golden_cases.hpp ros2/stretch_wbc_ros/test/controller_golden.hpp

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Eigen
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev cmake

      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build cpp/build --parallel

      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure

  # The ROS 2 node and its gtest suite, built with colcon in ROS 2 Humble.
  # Not run on the author's laptop, which has no ROS 2 installation.
  ros2:
    runs-on: ubuntu-latest
    container: ros:humble-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libeigen3-dev python3-colcon-common-extensions \
            ros-humble-tf2-ros ros-humble-ament-cmake-gtest

      - name: Build and test stretch_wbc_ros
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --base-paths ros2 --packages-select stretch_wbc_ros
          colcon test --base-paths ros2 --packages-select stretch_wbc_ros --event-handlers console_direct+
          colcon test-result --verbose
